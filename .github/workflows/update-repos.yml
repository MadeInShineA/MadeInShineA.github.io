name: Update site data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update-repos.sh
      - scripts/update-apod.py
      - .github/workflows/update-repos.yml

permissions:
  contents: write

concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch repositories
        env:
          # A personal token avoids rate limits; the built-in token works for public data too.
          GITHUB_TOKEN: ${{ secrets.GH_FETCH_TOKEN || github.token }}
        run: bash scripts/update-repos.sh assets/repos-data.js

      - name: Fetch NASA picture of the day
        # Runs even if fetching repositories failed, so one outage doesn't block the other
        if: ${{ !cancelled() }}
        run: python3 scripts/update-apod.py assets/apod-data.js

      - name: Commit data files if they changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- assets/repos-data.js assets/apod-data.js; then
            echo "Data is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/repos-data.js assets/apod-data.js
          git commit -m "chore: update site data"
          git pull --rebase
          git push
